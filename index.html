<!doctype html>
<html class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecrew - Crew Room</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;family=Lora:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%); }
    
    .menu-card { 
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .menu-card:hover { 
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 25px 50px rgba(6, 182, 212, 0.15), 0 0 40px rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    
    .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }
    
    .slide-up { animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
    
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
    .submenu-panel { animation: expandDown 0.3s ease forwards; }
    @keyframes expandDown { from { opacity:0; max-height:0; } to { opacity:1; max-height:800px; } }
    
    .glow-border { 
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    
    .premium-gradient {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    }
    
    .text-gradient {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .smooth-button {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    
    .smooth-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
    }
    
    .smooth-button:active {
      transform: translateY(0);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full"><!-- Splash Screen --> <!-- Login Screen -->
  <div id="login-screen" class="h-full w-full flex items-center justify-center p-4">
   <div class="w-full max-w-md">
    <div class="glow-border rounded-3xl p-8 relative">
     <div class="absolute inset-0 bg-gradient-to-br from-slate-900/80 to-slate-900/60 rounded-3xl -z-10"></div>
     <div class="flex items-center justify-center gap-4 mb-8">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-2xl shadow-cyan-500/20"><img src="https://lh3.googleusercontent.com/d/1QjWJQ90JWfn6ZlrXJ7eu--bRbpuVvDT-" alt="Ecrew Logo" class="w-full h-full object-contain rounded-2xl">
      </div>
      <h1 class="text-white font-bold text-3xl text-gradient">Ecrew</h1>
     </div>
     <h2 class="text-white text-center font-semibold text-xl mb-2">Crew Room</h2>
     <p class="text-slate-400 text-center text-sm mb-8">Access your flight operations portal</p>
     <form id="login-form" class="space-y-4">
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Username</label> <input id="login-user" type="text" required class="w-full bg-slate-800/40 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:bg-slate-800/60 transition" placeholder="admin or aircrew">
      </div>
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Password</label> <input id="login-pass" type="password" required class="w-full bg-slate-800/40 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:bg-slate-800/60 transition" placeholder="Enter password">
      </div>
      <div id="login-error" class="hidden bg-red-500/10 border border-red-500/30 text-red-300 text-sm p-3 rounded-lg"></div><button type="submit" class="w-full premium-gradient text-white font-bold py-3 rounded-xl transition smooth-button shadow-xl shadow-cyan-500/20">Login</button>
     </form>
     <div class="text-slate-400 text-xs mt-8 p-4 bg-slate-800/30 rounded-xl text-center border border-slate-700/30">
      <p class="text-slate-300">Powered by <span class="text-cyan-400 font-semibold">SkyOps Solution</span> 2026</p>
     </div>
    </div>
   </div>
  </div><!-- Main App -->
  <div id="app" class="hidden h-full w-full overflow-auto"><!-- Header -->
   <header class="bg-slate-900/60 backdrop-blur-xl border-b border-slate-700/40 px-6 py-5 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between w-full">
     <div class="flex items-center gap-4 flex-1">
      <button id="btn-back" class="hidden text-slate-300 hover:text-white transition hover:scale-110"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
      <div class="w-11 h-11 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/20"><img src="https://lh3.googleusercontent.com/d/1QjWJQ90JWfn6ZlrXJ7eu--bRbpuVvDT-" alt="Ecrew Logo" class="w-full h-full object-contain rounded-2xl">
      </div>
      <div>
       <h1 id="dash-title" class="text-white font-bold text-lg tracking-tight">Ecrew - Crew Room</h1>
       <p id="dash-welcome" class="text-slate-400 text-xs font-medium">Welcome back, Captain!</p>
      </div>
     </div>
     <div id="admin-controls" class="hidden flex items-center gap-3"><button id="btn-add" class="flex items-center gap-2 premium-gradient text-white font-semibold px-5 py-2.5 rounded-xl transition smooth-button shadow-lg shadow-cyan-500/20"> <i data-lucide="plus" class="w-4 h-4"></i> Add Menu </button>
     </div><button id="btn-logout" class="flex items-center gap-2 bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 font-medium px-4 py-2.5 rounded-xl transition border border-slate-700/30 smooth-button"> <i data-lucide="log-out" class="w-4 h-4"></i> Logout </button>
    </div>
   </header><!-- Menu Grid -->
   <main class="max-w-7xl mx-auto px-6 py-8">
    <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
    </div>
    <div id="empty-state" class="hidden text-center py-20 fade-in">
     <div class="w-24 h-24 mx-auto rounded-3xl glow-border flex items-center justify-center mb-6"><i data-lucide="layout-grid" class="w-12 h-12 text-slate-600"></i>
     </div>
     <p class="text-slate-400 text-lg font-semibold">No menus yet</p>
     <p class="text-slate-500 text-sm mt-2">Click "Add Menu" to get started</p>
    </div>
   </main><!-- Submenu Panel -->
   <div id="submenu-overlay" class="hidden fixed inset-0 z-40 bg-slate-900 flex flex-col">
    <div class="bg-slate-800/80 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0">
     <h2 id="submenu-title" class="text-white font-bold text-xl"></h2><button id="submenu-close" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>
    <main class="flex-1 overflow-auto px-6 py-8">
     <div id="submenu-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>
   </div><!-- Add/Edit Modal -->
   <div id="modal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
    <div class="bg-slate-900 rounded-3xl w-full max-w-md glow-border slide-up">
     <div class="p-6 border-b border-slate-700/40 flex items-center justify-between">
      <h2 id="modal-title" class="text-white font-bold text-xl">Add Menu</h2><button id="modal-close" class="text-slate-400 hover:text-white transition hover:scale-110"><i data-lucide="x" class="w-5 h-5"></i></button>
     </div>
     <form id="menu-form" class="p-6 space-y-5">
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Menu Name</label> <input id="f-name" type="text" required class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:bg-slate-800/70 transition" placeholder="e.g. Flight Schedule">
      </div>
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Image URL</label>
       <div id="img-preview-wrap" class="hidden mb-3">
        <img id="img-preview" class="w-full h-32 object-contain rounded-xl">
       </div><input id="f-image" type="text" class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:bg-slate-800/70 transition" placeholder="https://drive.google.com/file/d/FILE_ID/view">
       <p class="text-slate-500 text-xs mt-2 font-medium">Google Drive: paste full link from "share" button</p>
      </div>
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Link URL</label> <input id="f-url" type="url" class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:bg-slate-800/70 transition" placeholder="https://example.com">
      </div>
      <div><label class="text-slate-300 text-sm font-semibold block mb-2">Parent Menu (optional)</label> <select id="f-parent" class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:bg-slate-800/70 transition"> <option value="">— None (Main Menu) —</option> </select>
      </div>
      <div class="flex gap-3 pt-2"><button type="submit" id="btn-submit" class="flex-1 premium-gradient text-white font-semibold py-3 rounded-xl transition smooth-button shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2"> <i data-lucide="check" class="w-4 h-4"></i> Save </button> <button type="button" id="btn-duplicate" class="hidden bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 font-semibold py-3 px-4 rounded-xl transition border border-blue-500/30 smooth-button" title="Duplicate this menu"> <i data-lucide="copy" class="w-4 h-4"></i> </button> <button type="button" id="btn-delete" class="hidden bg-red-500/20 text-red-300 hover:bg-red-500/30 font-semibold py-3 px-4 rounded-xl transition border border-red-500/30 smooth-button"> <i data-lucide="trash-2" class="w-4 h-4"></i> </button>
      </div>
      <div id="form-msg" class="hidden text-center text-sm py-2 px-3 rounded-lg"></div>
     </form>
    </div>
   </div>
  </div>
  <script>
  // Image conversion helper
  function convertGoogleDriveUrl(url) {
    if (!url) return '';
    const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (match && match[1]) {
      return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }
    return url;
  }


  // Auth state
  let currentUser = null;
  let isAdmin = false;
  let allMenus = [];
  let editingItem = null;
  let imageUrl = '';
  let currentView = 'dashboard'; // 'dashboard' or 'submenu'


  const defaultConfig = {
    dashboard_title: 'Ecrew - Crew Room',
    welcome_text: 'Welcome back, Captain!',
    bg_color: '#0f172a',
    card_color: '#1e293b',
    text_color: '#f1f5f9',
    accent_color: '#06b6d4',
    secondary_color: '#334155',
    font_family: 'Plus Jakarta Sans',
    font_size: 14
  };


  // Element SDK
  window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => {
      const c = { ...defaultConfig, ...config };
      if (document.getElementById('dash-title')) {
        document.getElementById('dash-title').textContent = c.dashboard_title;
        document.getElementById('dash-welcome').textContent = c.welcome_text;
        document.getElementById('app').style.background = c.bg_color;
        document.querySelectorAll('.menu-card').forEach(el => el.style.background = c.card_color);
        document.body.style.fontFamily = `${c.font_family}, sans-serif`;
        document.body.style.fontSize = c.font_size + 'px';
      }
    },
    mapToCapabilities: (config) => {
      const c = { ...defaultConfig, ...config };
      const make = (key) => ({
        get: () => c[key] || defaultConfig[key],
        set: (v) => { c[key] = v; window.elementSdk.setConfig({ [key]: v }); }
      });
      return {
        recolorables: [make('bg_color'), make('card_color'), make('text_color'), make('accent_color'), make('secondary_color')],
        borderables: [],
        fontEditable: make('font_family'),
        fontSizeable: make('font_size')
      };
    },
    mapToEditPanelValues: (config) => {
      const c = { ...defaultConfig, ...config };
      return new Map([
        ['dashboard_title', c.dashboard_title],
        ['welcome_text', c.welcome_text]
      ]);
    }
  });


  // Data SDK
  const dataHandler = {
    onDataChanged(data) {
      allMenus = data;
      renderMenus();
    }
  };


  (async () => {
    await window.dataSdk.init(dataHandler);
  })();


  // Login handler
  document.getElementById('login-form').onsubmit = (e) => {
    e.preventDefault();
    const user = document.getElementById('login-user').value.trim().toLowerCase();
    const pass = document.getElementById('login-pass').value.trim();
    const errorEl = document.getElementById('login-error');


    const validAdmin = user === 'admin' && pass === 'ramdan28';
    const validUser = user === 'aircrew' && pass === 'flightopstwa';


    if (!validAdmin && !validUser) {
      errorEl.textContent = '❌ Invalid username or password';
      errorEl.classList.remove('hidden');
      return;
    }


    currentUser = user;
    isAdmin = validAdmin;
    
    // Show dashboard directly
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    
    // Show/hide admin controls
    if (isAdmin) {
      document.getElementById('admin-controls').classList.remove('hidden');
      document.getElementById('dash-welcome').textContent = '🔐 Admin Panel - Manage all menus';
    } else {
      document.getElementById('admin-controls').classList.add('hidden');
      document.getElementById('dash-welcome').textContent = '✈️ Welcome, Aircrew Member!';
    }


    renderMenus();
    lucide.createIcons();
  };


  // Back button handler
  document.getElementById('btn-back').onclick = () => {
    showDashboard();
  };


  // Logout handler
  document.getElementById('btn-logout').onclick = () => {
    currentUser = null;
    isAdmin = false;
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-form').reset();
    document.getElementById('login-error').classList.add('hidden');
    lucide.createIcons();
  };


  // Dashboard view
  function showDashboard() {
    currentView = 'dashboard';
    document.getElementById('btn-back').classList.add('hidden');
    document.getElementById('menu-grid').parentElement.classList.remove('hidden');
    document.getElementById('submenu-overlay').classList.add('hidden');
  }


  // Render main menus
  function renderMenus() {
    const grid = document.getElementById('menu-grid');
    const empty = document.getElementById('empty-state');
    const mainMenus = allMenus.filter(m => !m.is_submenu || !m.parent_id);


    if (mainMenus.length === 0) {
      grid.innerHTML = '';
      if (isAdmin) {
        empty.classList.remove('hidden');
      } else {
        empty.innerHTML = '<div class="text-center py-20"><div class="w-20 h-20 mx-auto rounded-2xl bg-slate-800 flex items-center justify-center mb-4"><i data-lucide="lock" class="w-10 h-10 text-slate-600"></i></div><p class="text-slate-500 text-lg">No menus available yet</p><p class="text-slate-600 text-sm mt-1">Admin will add them soon</p></div>';
        empty.classList.remove('hidden');
      }
      return;
    }
    empty.classList.add('hidden');


    const existingIds = new Set();
    mainMenus.forEach((menu, i) => {
      existingIds.add(menu.__backendId);
      let card = grid.querySelector(`[data-id="${menu.__backendId}"]`);
      if (!card) {
        card = document.createElement('div');
        card.dataset.id = menu.__backendId;
        card.className = 'menu-card bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 cursor-pointer relative group fade-in aspect-square';
        card.style.animationDelay = `${i * 0.05}s`;
        grid.appendChild(card);
      }
      const subCount = allMenus.filter(s => s.parent_id === menu.id && s.is_submenu).length;
      const imgHtml = menu.image_url ? `<img src="${menu.image_url}" alt="${menu.name}" class="w-full h-full object-cover" onerror="this.style.background='#334155';">` : `<i data-lucide="folder" class="w-10 h-10 text-slate-500"></i>`;
      
      let cardHtml;
      if (isAdmin) {
        cardHtml = `
          <div class="flex flex-col h-full">
            <div class="flex-1 bg-slate-700 flex items-center justify-center overflow-hidden">
              ${imgHtml}
            </div>
            <div class="p-2 text-center">
              <p class="text-white font-semibold text-xs line-clamp-2">${menu.name}</p>
              ${subCount > 0 ? `<p class="text-cyan-400 text-xs mt-0.5">${subCount} sub</p>` : ''}
            </div>
          </div>
          <button class="edit-btn absolute top-2 right-2 bg-slate-900/70 rounded-lg p-1.5 opacity-0 group-hover:opacity-100 transition"><i data-lucide="edit" class="w-3.5 h-3.5 text-slate-300"></i></button>
        `;
      } else {
        cardHtml = `
          <div class="flex flex-col h-full">
            <div class="flex-1 bg-slate-700 flex items-center justify-center overflow-hidden">
              ${imgHtml}
            </div>
            <div class="p-2 text-center">
              <p class="text-white font-semibold text-xs line-clamp-2">${menu.name}</p>
            </div>
          </div>
        `;
      }
      card.innerHTML = cardHtml;
      card.onclick = (e) => {
        if (e.target.closest('.edit-btn')) { openEdit(menu); return; }
        if (subCount > 0) { openSubmenu(menu); }
        else if (menu.url) { window.open(menu.url, '_blank', 'noopener,noreferrer'); }
      };
    });


    [...grid.children].forEach(el => {
      if (!existingIds.has(el.dataset.id)) el.remove();
    });


    lucide.createIcons();
  }


  // Open submenu
  function openSubmenu(parent) {
    currentView = 'submenu';
    const overlay = document.getElementById('submenu-overlay');
    document.getElementById('btn-back').classList.remove('hidden');
    document.getElementById('menu-grid').parentElement.classList.add('hidden');
    document.getElementById('submenu-title').textContent = parent.name;
    const grid = document.getElementById('submenu-grid');
    const subs = allMenus.filter(s => s.parent_id === parent.id && s.is_submenu);
    grid.innerHTML = subs.map(s => {
      const hasImg = s.image_url && s.image_url.length > 0;
      return `<div class="menu-card bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 cursor-pointer group relative" data-url="${s.url || ''}" data-bid="${s.__backendId}">
        <div class="h-40 bg-slate-700 flex items-center justify-center overflow-hidden">
          ${hasImg ? `<img src="${s.image_url}" alt="${s.name}" class="w-full h-full object-cover" onerror="this.style.background='#475569';">` : `<i data-lucide="file" class="w-10 h-10 text-slate-400"></i>`}
        </div>
        <div class="p-4 text-center">
          <p class="text-white font-semibold text-sm truncate">${s.name}</p>
        </div>
        ${isAdmin ? `<button class="edit-sub absolute top-2 right-2 bg-slate-900/70 rounded-lg p-1.5 opacity-0 group-hover:opacity-100 transition"><i data-lucide="edit" class="w-3.5 h-3.5 text-slate-300"></i></button>` : ''}
      </div>`;
    }).join('');
    grid.querySelectorAll('.menu-card').forEach(el => {
      el.onclick = (e) => {
        if (e.target.closest('.edit-sub')) {
          const item = allMenus.find(m => m.__backendId === el.dataset.bid);
          if (item) openEdit(item);
          return;
        }
        if (el.dataset.url) {
          window.open(el.dataset.url, '_blank', 'noopener,noreferrer');
        }
      };
    });
    overlay.classList.remove('hidden');
    lucide.createIcons();
  }


  document.getElementById('submenu-close').onclick = () => showDashboard();


  function openModal(edit = null) {
    editingItem = edit;
    imageUrl = edit?.image_url || '';
    document.getElementById('modal-title').textContent = edit ? 'Edit Menu' : 'Add Menu';
    document.getElementById('f-name').value = edit?.name || '';
    document.getElementById('f-url').value = edit?.url || '';
    document.getElementById('f-image').value = edit?.image_url || '';
    document.getElementById('btn-delete').classList.toggle('hidden', !edit);
    document.getElementById('btn-duplicate').classList.toggle('hidden', !edit);
    document.getElementById('form-msg').classList.add('hidden');


    if (imageUrl) {
      document.getElementById('img-preview').src = imageUrl;
      document.getElementById('img-preview-wrap').classList.remove('hidden');
    } else {
      document.getElementById('img-preview-wrap').classList.add('hidden');
    }


    const sel = document.getElementById('f-parent');
    const mains = allMenus.filter(m => !m.is_submenu && (!edit || m.__backendId !== edit.__backendId));
    sel.innerHTML = '<option value="">— None (Main Menu) —</option>' + mains.map(m => `<option value="${m.id}" ${edit?.parent_id === m.id ? 'selected' : ''}>${m.name}</option>`).join('');


    document.getElementById('modal').classList.remove('hidden');
  }


  function openEdit(item) { openModal(item); }


  document.getElementById('btn-add').onclick = () => openModal();
  document.getElementById('modal-close').onclick = () => document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden'); };


  document.getElementById('f-image').onchange = (e) => {
    const url = e.target.value.trim();
    if (!url) {
      document.getElementById('img-preview-wrap').classList.add('hidden');
      imageUrl = '';
      return;
    }
    imageUrl = url;
    document.getElementById('img-preview').src = url;
    document.getElementById('img-preview-wrap').classList.remove('hidden');
  };


  document.getElementById('menu-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="animate-pulse">Saving...</span>';


    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    const imgUrl = document.getElementById('f-image').value.trim();
    const parentId = document.getElementById('f-parent').value;


    const finalImageUrl = convertGoogleDriveUrl(imgUrl);


    const record = {
      id: editingItem?.id || Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name,
      image_url: finalImageUrl,
      url,
      is_submenu: !!parentId,
      parent_id: parentId,
      order: editingItem?.order || allMenus.length
    };


    let result;
    if (editingItem) {
      result = await window.dataSdk.update({ ...editingItem, ...record });
    } else {
      if (allMenus.length >= 999) {
        showFormMsg('Maximum 999 menus reached.', true);
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Save';
        lucide.createIcons();
        return;
      }
      result = await window.dataSdk.create(record);
    }


    if (result.isOk) {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('submenu-overlay').classList.add('hidden');
    } else {
      showFormMsg('Failed to save. Try again.', true);
    }
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Save';
    lucide.createIcons();
  };


  // Duplicate
  document.getElementById('btn-duplicate').onclick = async () => {
    if (!editingItem) return;
    const btn = document.getElementById('btn-duplicate');
    btn.disabled = true;
    btn.innerHTML = '<span class="animate-pulse">...</span>';


    const newRecord = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name: editingItem.name + ' (Copy)',
      image_url: editingItem.image_url,
      url: editingItem.url,
      is_submenu: editingItem.is_submenu,
      parent_id: editingItem.parent_id,
      order: allMenus.length
    };


    const result = await window.dataSdk.create(newRecord);
    if (result.isOk) {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('submenu-overlay').classList.add('hidden');
    } else {
      showFormMsg('Failed to duplicate.', true);
    }
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i>';
    lucide.createIcons();
  };


  // Delete
  document.getElementById('btn-delete').onclick = async () => {
    if (!editingItem) return;
    const btn = document.getElementById('btn-delete');
    btn.disabled = true;
    btn.textContent = '...';
    const children = allMenus.filter(m => m.parent_id === editingItem.id);
    for (const child of children) await window.dataSdk.delete(child);
    const result = await window.dataSdk.delete(editingItem);
    if (result.isOk) {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('submenu-overlay').classList.add('hidden');
    } else {
      showFormMsg('Failed to delete.', true);
    }
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
    lucide.createIcons();
  };


  function showFormMsg(text, isError) {
    const el = document.getElementById('form-msg');
    el.textContent = text;
    el.className = `text-center text-sm py-2 px-3 rounded-lg ${isError ? 'bg-red-500/20 text-red-300' : 'bg-green-500/20 text-green-300'}`;
    el.classList.remove('hidden');
  }


  lucide.createIcons();
</script>
